name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build · typecheck · test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm) from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/mcp imports the core's built dist/, so build core before typecheck/test.
      - run: pnpm -C packages/core build

      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Signed-shortcut drift guard: the committed signed asset was minted from
      # a canonical build whose (unsigned) sha256 is committed alongside it.
      # If plist.ts changes without a re-sign (docs/RESIGNING.md), fail here.
      - run: |
          pnpm build:shortcut
          echo "$(cat web/assets/canonical.sha256)  build/sync-health-data.shortcut" | shasum -a 256 -c - \
            || { echo "::error::canonical shortcut changed but the signed asset was not re-signed — see docs/RESIGNING.md"; exit 1; }

      # Exercises the setup wizard's function-bundling pipeline end to end:
      # bundle:functions -> apps/mcp build (tsc + copy-functions.mjs) -> the
      # bundles land in apps/mcp/dist/functions, and `setup` still reaches a
      # helpful preflight message with no Supabase CLI session.
      - run: pnpm bundle:functions
      - run: pnpm -C apps/mcp build
      - run: test -f apps/mcp/dist/functions/health-mcp.ts
      - run: test -f apps/mcp/dist/functions/health-ingest.ts
      - name: setup wizard dry probe (no Supabase CLI session)
        run: |
          set +e
          mkdir -p /tmp/fake-home
          SUPABASE_ACCESS_TOKEN='' HOME=/tmp/fake-home node apps/mcp/dist/main.js setup < /dev/null > /tmp/setup-dry.out 2>&1
          status=$?
          cat /tmp/setup-dry.out
          if [ "$status" -eq 0 ]; then
            echo "expected the dry probe to exit non-zero (no login session available)"
            exit 1
          fi
          grep -q "checking for the Supabase CLI" /tmp/setup-dry.out || { echo "missing preflight message"; exit 1; }
