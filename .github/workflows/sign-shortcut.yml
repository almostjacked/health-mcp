name: Sign Canonical Shortcut

# Signs ONE canonical "Sync Health Data" shortcut (no per-user values —
# see web/src/shortcut/plist.ts's buildCanonicalShortcut) and commits the
# signed asset back to main. iOS refuses unsigned shortcut imports
# (verified on-device); `shortcuts sign -m anyone` is the fix, but that CLI
# only exists on macOS, so this can't run on the ubuntu runner the rest of
# CI uses.
#
# VERIFIED FAILING on GitHub-hosted macos-latest runners (run 31193950707,
# 2026-08-07): `shortcuts sign` exits 1 with "Error: In order to do this,
# you must be signed into iCloud." — hosted runners have no Apple ID
# session and there's no way to provision one non-interactively. So this
# workflow is workflow_dispatch-only (not wired to push) — it's a
# ready-to-go escape hatch for if that ever changes (a future runner image,
# a self-hosted macOS runner with an iCloud session, etc.), not something
# expected to succeed today. The real path for re-signing after a
# plist.ts change is the manual one-liner in docs/RESIGNING.md, run on any
# macOS machine that's already signed into iCloud (any normal Mac
# qualifies — no paid developer account needed for -m anyone).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-shortcut
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm) from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:shortcut

      - name: Sign with shortcuts CLI
        run: |
          mkdir -p web/assets
          shortcuts sign -m anyone -i build/sync-health-data.shortcut -o web/assets/sync-health-data-signed.shortcut

      - name: Commit signed asset
        run: |
          git config user.name "sign-bot"
          git config user.email "sign-bot@users.noreply.github.com"
          git add web/assets/sync-health-data-signed.shortcut
          if git diff --cached --quiet; then
            echo "no change to the signed asset — nothing to commit"
            exit 0
          fi
          git commit -m "chore: sign canonical shortcut [sign-bot]"
          git push
